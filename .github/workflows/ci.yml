# Runs the checks on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway PostgreSQL + PostGIS for the database tests, the same image
    # as docker-compose.yml. The name, password and port match .env.example.
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: phmonitor
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: phmonitor
        ports:
          - 5433:5432
        # The steps below wait until the database answers.
        options: >-
          --health-cmd "pg_isready -U phmonitor -d phmonitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installs exactly what package-lock.json lists.
      - run: npm ci

      # The server reads its settings from .env; the example values match
      # the database service above.
      - run: cp .env.example .env

      - run: npm run typecheck
      # Unit tests: no database, no internet.
      - run: npm test
      # Database tests: the real SQL against a small seeded map, in a separate
      # "phmonitor_test" database that the tests create themselves.
      - run: npm run test:db
      - run: npm run build
