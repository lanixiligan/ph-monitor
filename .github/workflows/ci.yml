# Runs the checks on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installs exactly what package-lock.json lists.
      - run: npm ci

      # The server reads its settings from .env; the example values are enough
      # here because the tests never open the database.
      - run: cp .env.example .env

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
